name: 功能建议 / Feature request
description: 提出新能力、新驱动适配器或平台能力建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提想法。请说明它解决的是哪一类测试场景，以及是否会影响现有安全护栏
        （命令白名单、限值锁定、数据溯源、失效安全）。

  - type: dropdown
    id: kind
    attributes:
      label: 类型 / Type
      options:
        - 新的驱动适配器（VISA / Modbus / OPC UA / HTTP / 其他）
        - 新的步骤类型（分支、并行、条件、断言等）
        - AI 规划能力（LLM / MCP / 测试计划生成）
        - 报告与数据分析
        - 多语言 / 主题 / 可访问性
        - 工程化（权限、数据库、部署）
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 现在的做法哪里不够用？请描述真实测试场景
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposal
      description: 如果涉及接口变更，请给出期望的工作流 JSON 或事件结构
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: 对安全护栏的影响 / Safety impact
      description: 是否会改变「AI 不生成命令、不放宽限值、测量值来自执行结果」这条边界？
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认 / Confirm
      options:
        - label: 我确认该建议不要求 AI 直接生成 SCPI / 协议命令字符串
          required: true
        - label: 我愿意参与实现或提供测试场景
          required: false
